[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-contrasting"
version = "0.1.0"
description = "Circuit and minimal contextual-contrasting models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml>=6.0.3",
    "sbi>=0.27.0",
    "scikit-learn",
    "seaborn",
    "torch>=2.5,<2.6",
    "tqdm",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["context_contrasting", "context_contrasting.paper", "thesis*", "paper_v2*"]

[tool.setuptools.package-data]
paper_v2 = ["configs/*.yaml", "ground_truth.csv", "model.csv", "model.yaml"]
